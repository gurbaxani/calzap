<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		
		<!-- PWA Metadata & Capabilities -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Calzap" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		
		<!-- Theme Colors for System UI -->
		<meta name="theme-color" content="#242834" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#fcfcff" media="(prefers-color-scheme: light)" />
		
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
